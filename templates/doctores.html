<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VITALSOFT - Gestión de Doctores</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #3498db;
            --secondary-color: #2ecc71;
            --accent-color: #f1c40f;
            --text-color: #333;
            --light-bg: #f9f9f9;
            --white: #ffffff;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: var(--light-bg);
            color: var(--text-color);
        }
        
        .container {
            display: flex;
            min-height: 100vh;
        }
        
        /* Sidebar styles */
        .sidebar {
            width: 250px;
            background-color: var(--primary-color);
            color: var(--white);
            padding: 20px 0;
            height: 100vh;
            position: fixed;
            transition: all 0.3s ease;
        }
        
        .sidebar-header {
            padding: 0 15px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .sidebar-header h2 {
            margin-bottom: 5px;
        }
        
        .sidebar-menu {
            padding: 20px 0;
        }
        
        .menu-item {
            padding: 15px 25px;
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .menu-item:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
        
        .menu-item i {
            margin-right: 10px;
            font-size: 18px;
        }
        
        .menu-item.active {
            background-color: rgba(255, 255, 255, 0.2);
            border-left: 4px solid var(--accent-color);
        }
        
        /* Main content styles */
        .main-content {
            flex: 1;
            margin-left: 250px;
            padding: 20px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            margin-bottom: 30px;
            border-bottom: 1px solid #eaeaea;
        }
        
        .page-title h1 {
            font-size: 24px;
            color: var(--primary-color);
        }
        
        .user-info {
            display: flex;
            align-items: center;
        }
        
        .user-info img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-right: 10px;
        }
        
        /* Card Styles */
        .card {
            background-color: var(--white);
            border-radius: 8px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            overflow: hidden;
        }
        
        .card-header {
            padding: 15px 20px;
            background-color: var(--primary-color);
            color: var(--white);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .card-body {
            padding: 20px;
        }
        
        /* Table Styles */
        .table-container {
            overflow-x: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        
        thead {
            background-color: #f2f2f2;
        }
        
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #eaeaea;
        }
        
        tr:hover {
            background-color: #f5f5f5;
        }
        
        /* Form Styles */
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        .form-control {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .form-control:focus {
            border-color: var(--primary-color);
            outline: none;
        }
        
        .btn {
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }
        
        .btn-success {
            background-color: var(--secondary-color);
            color: white;
        }
        
        .btn-warning {
            background-color: var(--accent-color);
            color: var(--text-color);
        }
        
        .btn-danger {
            background-color: #e74c3c;
            color: white;
        }
        
        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        
        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            background-color: var(--white);
            width: 500px;
            max-width: 90%;
            border-radius: 8px;
            box-shadow: var(--shadow);
        }
        
        .modal-header {
            padding: 15px 20px;
            background-color: var(--primary-color);
            color: var(--white);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
        }
        
        .modal-body {
            padding: 20px;
        }
        
        .modal-footer {
            padding: 15px 20px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            border-top: 1px solid #eaeaea;
        }
        
        .close {
            cursor: pointer;
            font-size: 22px;
        }
        
        /* Utility Classes */
        .mt-20 {
            margin-top: 20px;
        }
        
        .action-buttons {
            display: flex;
            gap: 5px;
        }
        
        /* Responsive Adjustments */
        @media (max-width: 768px) {
            .sidebar {
                width: 70px;
                padding: 15px 0;
            }
            
            .sidebar-header h2, .sidebar-header p, .menu-item span {
                display: none;
            }
            
            .menu-item {
                padding: 15px 0;
                justify-content: center;
            }
            
            .menu-item i {
                margin-right: 0;
                font-size: 20px;
            }
            
            .main-content {
                margin-left: 70px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>VITALSOFT</h2>
                <p>Sistema de Gestión Médica</p>
            </div>
            <div class="sidebar-menu">
                <div class="menu-item">
                    <i class="fas fa-home"></i>
                    <span>Dashboard</span>
                </div>
                <div class="menu-item">
                    <i class="fas fa-user-injured"></i>
                    <span>Pacientes</span>
                </div>
                <div class="menu-item active">
                    <i class="fas fa-user-md"></i>
                    <span>Doctores</span>
                </div>
                <div class="menu-item">
                    <i class="fas fa-calendar-check"></i>
                    <span>Citas</span>
                </div>
                <div class="menu-item">
                    <i class="fas fa-file-medical"></i>
                    <span>Historias Clínicas</span>
                </div>
                <div class="menu-item">
                    <i class="fas fa-pills"></i>
                    <span>Medicamentos</span>
                </div>
                <div class="menu-item">
                    <i class="fas fa-chart-bar"></i>
                    <span>Reportes</span>
                </div>
                <div class="menu-item">
                    <i class="fas fa-cog"></i>
                    <span>Configuración</span>
                </div>
                <div class="menu-item">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Cerrar Sesión</span>
                </div>
            </div>
        </div>
        
        <!-- Main Content -->
        <div class="main-content">
            <div class="header">
                <div class="page-title">
                    <h1>Gestión de Doctores</h1>
                </div>
                <div class="user-info">
                    <img src="/api/placeholder/40/40" alt="Usuario">
                    <div>
                        <p>Administrador</p>
                    </div>
                </div>
            </div>
            
            <!-- Doctor List Card -->
            <div class="card">
                <div class="card-header">
                    <h2>Lista de Doctores</h2>
                    <button class="btn btn-success" onclick="openAddModal()">
                        <i class="fas fa-plus"></i> Nuevo Doctor
                    </button>
                </div>
                <div class="card-body">
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Nombre</th>
                                    <th>Especialidad</th>
                                    <th>Email</th>
                                    <th>Teléfono</th>
                                    <th>Estado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="doctorTableBody">
                                <!-- JavaScript will populate this -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Add Doctor Modal -->
    <div id="addDoctorModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Agregar Nuevo Doctor</h2>
                <span class="close" onclick="closeAddModal()">&times;</span>
            </div>
            <div class="modal-body">
                <form id="addDoctorForm">
                    <div class="form-group">
                        <label for="nombre">Nombre Completo</label>
                        <input type="text" id="nombre" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="especialidad">Especialidad</label>
                        <select id="especialidad" class="form-control" required>
                            <option value="">Seleccionar Especialidad</option>
                            <option value="Cardiología">Cardiología</option>
                            <option value="Dermatología">Dermatología</option>
                            <option value="Ginecología">Ginecología</option>
                            <option value="Pediatría">Pediatría</option>
                            <option value="Neurología">Neurología</option>
                            <option value="Oftalmología">Oftalmología</option>
                            <option value="Traumatología">Traumatología</option>
                            <option value="Psiquiatría">Psiquiatría</option>
                            <option value="Medicina General">Medicina General</option>
                            <option value="Medicina Interna">Medicina Interna</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="telefono">Teléfono</label>
                        <input type="tel" id="telefono" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="direccion">Dirección</label>
                        <input type="text" id="direccion" class="form-control">
                    </div>
                    <div class="form-group">
                        <label for="fechaContratacion">Fecha de Contratación</label>
                        <input type="date" id="fechaContratacion" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="estado">Estado</label>
                        <select id="estado" class="form-control" required>
                            <option value="Activo">Activo</option>
                            <option value="Inactivo">Inactivo</option>
                            <option value="Vacaciones">Vacaciones</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" onclick="saveDoctor()">Guardar</button>
                <button class="btn btn-danger" onclick="closeAddModal()">Cancelar</button>
            </div>
        </div>
    </div>
    
    <!-- Edit Doctor Modal -->
    <div id="editDoctorModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Editar Doctor</h2>
                <span class="close" onclick="closeEditModal()">&times;</span>
            </div>
            <div class="modal-body">
                <form id="editDoctorForm">
                    <input type="hidden" id="edit_id">
                    <div class="form-group">
                        <label for="edit_nombre">Nombre Completo</label>
                        <input type="text" id="edit_nombre" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="edit_especialidad">Especialidad</label>
                        <select id="edit_especialidad" class="form-control" required>
                            <option value="">Seleccionar Especialidad</option>
                            <option value="Cardiología">Cardiología</option>
                            <option value="Dermatología">Dermatología</option>
                            <option value="Ginecología">Ginecología</option>
                            <option value="Pediatría">Pediatría</option>
                            <option value="Neurología">Neurología</option>
                            <option value="Oftalmología">Oftalmología</option>
                            <option value="Traumatología">Traumatología</option>
                            <option value="Psiquiatría">Psiquiatría</option>
                            <option value="Medicina General">Medicina General</option>
                            <option value="Medicina Interna">Medicina Interna</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="edit_email">Email</label>
                        <input type="email" id="edit_email" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="edit_telefono">Teléfono</label>
                        <input type="tel" id="edit_telefono" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="edit_direccion">Dirección</label>
                        <input type="text" id="edit_direccion" class="form-control">
                    </div>
                    <div class="form-group">
                        <label for="edit_fechaContratacion">Fecha de Contratación</label>
                        <input type="date" id="edit_fechaContratacion" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="edit_estado">Estado</label>
                        <select id="edit_estado" class="form-control" required>
                            <option value="Activo">Activo</option>
                            <option value="Inactivo">Inactivo</option>
                            <option value="Vacaciones">Vacaciones</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" onclick="updateDoctor()">Actualizar</button>
                <button class="btn btn-danger" onclick="closeEditModal()">Cancelar</button>
            </div>
        </div>
    </div>
    
    <!-- JavaScript for functionality -->
    <script>
        // Sample data for demonstration
        let doctores = [
            { id: 1, nombre: 'Dr. Juan Pérez', especialidad: 'Cardiología', email: 'jperez@vitalsoft.com', telefono: '555-1234', direccion: 'Av. Salud 123', fechaContratacion: '2022-01-15', estado: 'Activo' },
            { id: 2, nombre: 'Dra. María López', especialidad: 'Pediatría', email: 'mlopez@vitalsoft.com', telefono: '555-5678', direccion: 'Calle Médica 456', fechaContratacion: '2021-03-10', estado: 'Activo' },
            { id: 3, nombre: 'Dr. Carlos Rodríguez', especialidad: 'Neurología', email: 'crodriguez@vitalsoft.com', telefono: '555-9012', direccion: 'Blvd. Hospital 789', fechaContratacion: '2023-02-20', estado: 'Vacaciones' },
            { id: 4, nombre: 'Dra. Ana Martínez', especialidad: 'Dermatología', email: 'amartinez@vitalsoft.com', telefono: '555-3456', direccion: 'Plaza Clínica 321', fechaContratacion: '2022-07-05', estado: 'Activo' },
            { id: 5, nombre: 'Dr. Roberto Sánchez', especialidad: 'Oftalmología', email: 'rsanchez@vitalsoft.com', telefono: '555-7890', direccion: 'Av. Visión 654', fechaContratacion: '2023-05-12', estado: 'Inactivo' }
        ];
        
        // Function to populate the table
        function renderDoctoresTable() {
            const tableBody = document.getElementById('doctorTableBody');
            tableBody.innerHTML = '';
            
            doctores.forEach(doctor => {
                const row = document.createElement('tr');
                
                row.innerHTML = `
                    <td>${doctor.id}</td>
                    <td>${doctor.nombre}</td>
                    <td>${doctor.especialidad}</td>
                    <td>${doctor.email}</td>
                    <td>${doctor.telefono}</td>
                    <td>
                        <span class="status-badge ${doctor.estado.toLowerCase()}">${doctor.estado}</span>
                    </td>
                    <td>
                        <div class="action-buttons">
                            <button class="btn btn-warning btn-sm" onclick="openEditModal(${doctor.id})">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="btn btn-danger btn-sm" onclick="deleteDoctor(${doctor.id})">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </td>
                `;
                
                tableBody.appendChild(row);
            });
        }
        
        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            renderDoctoresTable();
        });
        
        // Modal functions
        function openAddModal() {
            document.getElementById('addDoctorForm').reset();
            document.getElementById('addDoctorModal').style.display = 'flex';
        }
        
        function closeAddModal() {
            document.getElementById('addDoctorModal').style.display = 'none';
        }
        
        function openEditModal(id) {
            const doctor = doctores.find(d => d.id === id);
            
            if (doctor) {
                document.getElementById('edit_id').value = doctor.id;
                document.getElementById('edit_nombre').value = doctor.nombre;
                document.getElementById('edit_especialidad').value = doctor.especialidad;
                document.getElementById('edit_email').value = doctor.email;
                document.getElementById('edit_telefono').value = doctor.telefono;
                document.getElementById('edit_direccion').value = doctor.direccion;
                document.getElementById('edit_fechaContratacion').value = doctor.fechaContratacion;
                document.getElementById('edit_estado').value = doctor.estado;
                
                document.getElementById('editDoctorModal').style.display = 'flex';
            }
        }
        
        function closeEditModal() {
            document.getElementById('editDoctorModal').style.display = 'none';
        }
        
        // CRUD Operations
        function saveDoctor() {
            const nombre = document.getElementById('nombre').value;
            const especialidad = document.getElementById('especialidad').value;
            const email = document.getElementById('email').value;
            const telefono = document.getElementById('telefono').value;
            const direccion = document.getElementById('direccion').value;
            const fechaContratacion = document.getElementById('fechaContratacion').value;
            const estado = document.getElementById('estado').value;
            
            // Simple validation
            if (!nombre || !especialidad || !email || !telefono || !fechaContratacion) {
                alert('Por favor llene todos los campos requeridos');
                return;
            }
            
            // Generate new ID (in a real app, this would come from the server)
            const newId = doctores.length > 0 ? Math.max(...doctores.map(d => d.id)) + 1 : 1;
            
            // Create new doctor object
            const newDoctor = {
                id: newId,
                nombre,
                especialidad,
                email,
                telefono,
                direccion,
                fechaContratacion,
                estado
            };
            
            // Add to the array
            doctores.push(newDoctor);
            
            // Refresh table and close modal
            renderDoctoresTable();
            closeAddModal();
            
            // In a real app, you would send this data to the server
            console.log('Nuevo doctor añadido:', newDoctor);
        }
        
        function updateDoctor() {
            const id = parseInt(document.getElementById('edit_id').value);
            const nombre = document.getElementById('edit_nombre').value;
            const especialidad = document.getElementById('edit_especialidad').value;
            const email = document.getElementById('edit_email').value;
            const telefono = document.getElementById('edit_telefono').value;
            const direccion = document.getElementById('edit_direccion').value;
            const fechaContratacion = document.getElementById('edit_fechaContratacion').value;
            const estado = document.getElementById('edit_estado').value;
            
            // Simple validation
            if (!nombre || !especialidad || !email || !telefono || !fechaContratacion) {
                alert('Por favor llene todos los campos requeridos');
                return;
            }
            
            // Find the doctor in the array
            const index = doctores.findIndex(d => d.id === id);
            
            if (index !== -1) {
                // Update doctor data
                doctores[index] = {
                    ...doctores[index],
                    nombre,
                    especialidad,
                    email,
                    telefono,
                    direccion,
                    fechaContratacion,
                    estado
                };
                
                // Refresh table and close modal
                renderDoctoresTable();
                closeEditModal();
                
                // In a real app, you would send this data to the server
                console.log('Doctor actualizado:', doctores[index]);
            }
        }
        
        function deleteDoctor(id) {
            if (confirm('¿Está seguro de que desea eliminar este doctor?')) {
                // Filter out the doctor
                doctores = doctores.filter(d => d.id !== id);
                
                // Refresh table
                renderDoctoresTable();
                
                // In a real app, you would send this request to the server
                console.log('Doctor eliminado, ID:', id);
            }
        }
    </script>
</body>
</html>
